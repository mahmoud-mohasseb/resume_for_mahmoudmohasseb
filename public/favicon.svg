<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF00" />
      <stop offset="60%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#06080C" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#neonGrad)" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Corner Reticle Dots -->
  <circle cx="9" cy="9" r="1.5" fill="#D4FF00" />
  <circle cx="55" cy="9" r="1.5" fill="#D4FF00" opacity="0.6" />
  <circle cx="9" cy="55" r="1.5" fill="#D4FF00" opacity="0.6" />
  <circle cx="55" cy="55" r="1.5" fill="#FF6B35" />

  <!-- MM Vector Monogram (Sharp geometric paths) -->
  <g filter="url(#neonGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left M -->
    <path
      d="M 14 44 V 20 L 22.5 32 L 31 20 V 44"
      stroke="#D4FF00"
      stroke-width="3.6"
    />
    <!-- Right M -->
    <path
      d="M 33 44 V 20 L 41.5 32 L 50 20 V 44"
      stroke="url(#neonGrad)"
      stroke-width="3.6"
    />
  </g>

  <!-- Center subtle power dot -->
  <circle cx="32" cy="13" r="1.8" fill="#D4FF00" />
</svg>
